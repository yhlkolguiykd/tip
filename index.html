<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمرین تایپ ده انگشتی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- منوی اصلی -->
        <nav class="nav-bar">
            <button class="nav-btn active" onclick="switchTab('home')">صفحه اصلی و مراحل</button>
            <button class="nav-btn" onclick="switchTab('practice')">محیط تمرین</button>
            <button class="nav-btn" onclick="switchTab('progress')">پیشرفت من</button>
        </nav>

        <!-- ۱. صفحه هوم -->
        <div id="home-tab" class="tab-content active">
            <h1>مراحل تمرین تایپ</h1>
            <p class="subtitle">برای شروع، روی یکی از مراحل زیر کلیک کن:</p>
            <div class="lessons-grid" id="lessons-grid"></div>
        </div>

        <!-- ۲. محیط تمرین -->
        <div id="practice-tab" class="tab-content">
            <div class="stats">
                <div>سرعت: <span id="wpm">0</span> WPM</div>
                <div>دقت: <span id="accuracy">100</span>%</div>
                <div>درس: <span id="lesson-num">1</span> از ۵۰</div>
            </div>

            <div class="display-box" id="text-display"></div>

            <div class="keyboard-container">
                <div class="keyboard" id="keyboard">
                    <div class="row">
                        <div class="key" data-key="ض">ض</div><div class="key" data-key="ص">ص</div><div class="key" data-key="ث">ث</div><div class="key" data-key="ق">ق</div><div class="key" data-key="ف">ف</div><div class="key" data-key="غ">غ</div><div class="key" data-key="ع">ع</div><div class="key" data-key="ه">ه</div><div class="key" data-key="خ">خ</div><div class="key" data-key="ح">ح</div><div class="key" data-key="ج">ج</div><div class="key" data-key="چ">چ</div>
                    </div>
                    <div class="row">
                        <div class="key home-key" data-key="ش">ش</div><div class="key home-key" data-key="س">س</div><div class="key home-key" data-key="ی">ی</div><div class="key home-key" data-key="ب">ب</div><div class="key" data-key="ل">ل</div><div class="key" data-key="ا">ا</div><div class="key home-key" data-key="ت">ت</div><div class="key home-key" data-key="ن">ن</div><div class="key home-key" data-key="م">م</div><div class="key home-key" data-key="ک">ک</div><div class="key" data-key="گ">گ</div>
                    </div>
                    <div class="row">
                        <div class="key" data-key="ظ">ظ</div><div class="key" data-key="ط">ط</div><div class="key" data-key="ز">ز</div><div class="key" data-key="ر">ر</div><div class="key" data-key="ذ">ذ</div><div class="key" data-key="د">د</div><div class="key" data-key="پ">پ</div><div class="key" data-key="و">و</div>
                    </div>
                    <div class="row">
                        <div class="key space" data-key=" ">فاصله (Space)</div>
                    </div>
                </div>

                <!-- دست واقعی و واقعی‌نما -->
                <div class="real-hands-wrapper">
                    <!-- دست چپ -->
                    <div class="hand-svg-container left-hand-svg">
                        <svg viewBox="0 0 200 220" class="hand-svg">
                            <path class="hand-base" d="M30 200 C30 150 40 130 50 120 C40 80 45 40 55 30 C65 20 75 35 75 70 C75 35 85 15 95 15 C105 15 110 35 110 70 C110 30 120 20 130 20 C140 20 145 40 145 75 C145 45 155 40 162 45 C170 50 168 80 165 110 C180 120 185 135 180 150 C170 180 150 200 120 210 Z" fill="#2a2b3d" stroke="#525470" stroke-width="3"/>
                            <!-- انگشتان چپ -->
                            <rect id="l-pinky" class="finger-zone" x="48" y="25" width="22" height="60" rx="11" />
                            <rect id="l-ring" class="finger-zone" x="83" y="10" width="22" height="70" rx="11" />
                            <rect id="l-middle" class="finger-zone" x="118" y="15" width="22" height="70" rx="11" />
                            <rect id="l-index" class="finger-zone" x="148" y="35" width="22" height="60" rx="11" />
                            <rect id="l-thumb" class="finger-zone" x="155" y="115" width="26" height="45" rx="13" transform="rotate(-30 165 135)" />
                        </svg>
                        <span class="hand-label">دست چپ</span>
                    </div>

                    <!-- دست راست -->
                    <div class="hand-svg-container right-hand-svg">
                        <svg viewBox="0 0 200 220" class="hand-svg">
                            <path class="hand-base" d="M170 200 C170 150 160 130 150 120 C160 80 155 40 145 30 C135 20 125 35 125 70 C125 35 115 15 105 15 C95 15 90 35 90 70 C90 30 80 20 70 20 C60 20 55 40 55 75 C55 45 45 40 38 45 C30 50 32 80 35 110 C20 120 15 135 20 150 C30 180 50 200 80 210 Z" fill="#2a2b3d" stroke="#525470" stroke-width="3"/>
                            <!-- انگشتان راست -->
                            <rect id="r-thumb" class="finger-zone" x="18" y="115" width="26" height="45" rx="13" transform="rotate(30 30 135)" />
                            <rect id="r-index" class="finger-zone" x="30" y="35" width="22" height="60" rx="11" />
                            <rect id="r-middle" class="finger-zone" x="60" y="15" width="22" height="70" rx="11" />
                            <rect id="r-ring" class="finger-zone" x="95" y="10" width="22" height="70" rx="11" />
                            <rect id="r-pinky" class="finger-zone" x="130" y="25" width="22" height="60" rx="11" />
                        </svg>
                        <span class="hand-label">دست راست</span>
                    </div>
                </div>
            </div>

            <div class="hand-hint" id="hand-hint">دست‌ها را مطابق تصویر روی کیبورد قرار بده</div>
        </div>

        <!-- ۳. صفحه پیشرفت -->
        <div id="progress-tab" class="tab-content">
            <h1>گزارش پیشرفت</h1>
            <div class="progress-card">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p class="progress-text" id="progress-text">۰٪ تکمیل شده</p>
                <div class="stats-summary">
                    دروس تکمیل‌شده: <span id="completed-count">0</span> از ۵۰
                </div>
                <button class="reset-btn" onclick="resetProgress()">شروع مجدد دوره</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
