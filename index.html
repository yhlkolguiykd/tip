<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آموزش تایپ ده انگشتی فارسی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- منوی بالای سایت -->
        <nav class="nav-bar">
            <button class="nav-btn active" onclick="switchTab('home')">خانه و مراحل</button>
            <button class="nav-btn" onclick="switchTab('practice')">محیط تمرین</button>
            <button class="nav-btn" onclick="switchTab('progress')">پیشرفت من</button>
        </nav>

        <!-- ۱. صفحه اصلی و لیست مراحل -->
        <div id="home-tab" class="tab-content active">
            <h1>انتخاب مرحله تمرین</h1>
            <p class="subtitle">یکی از ۵۰ مرحله زیر را برای شروع تایپ انتخاب کنید:</p>
            <div class="lessons-grid" id="lessons-grid"></div>
        </div>

        <!-- ۲. محیط اصلی تمرین -->
        <div id="practice-tab" class="tab-content">
            <div class="stats">
                <div>سرعت: <span id="wpm">0</span> WPM</div>
                <div>دقت: <span id="accuracy">100</span>%</div>
                <div>درس: <span id="lesson-num">1</span> از ۵۰</div>
            </div>

            <div class="display-box" id="text-display"></div>

            <div class="keyboard-section">
                <div class="keyboard" id="keyboard">
                    <div class="row">
                        <div class="key" data-key="ض">ض</div><div class="key" data-key="ص">ص</div><div class="key" data-key="ث">ث</div><div class="key" data-key="ق">ق</div><div class="key" data-key="ف">ف</div><div class="key" data-key="غ">غ</div><div class="key" data-key="ع">ع</div><div class="key" data-key="ه">ه</div><div class="key" data-key="خ">خ</div><div class="key" data-key="ح">ح</div><div class="key" data-key="ج">ج</div><div class="key" data-key="چ">چ</div>
                    </div>
                    <div class="row">
                        <div class="key home-key" data-key="ش">ش</div><div class="key home-key" data-key="س">س</div><div class="key home-key" data-key="ی">ی</div><div class="key home-key" data-key="ب">ب</div><div class="key" data-key="ل">ل</div><div class="key" data-key="ا">ا</div><div class="key home-key" data-key="ت">ت</div><div class="key home-key" data-key="ن">ن</div><div class="key home-key" data-key="م">م</div><div class="key home-key" data-key="ک">ک</div><div class="key" data-key="گ">گ</div>
                    </div>
                    <div class="row">
                        <div class="key" data-key="ظ">ظ</div><div class="key" data-key="ط">ط</div><div class="key" data-key="ز">ز</div><div class="key" data-key="ر">ر</div><div class="key" data-key="ذ">ذ</div><div class="key" data-key="د">د</div><div class="key" data-key="پ">پ</div><div class="key" data-key="و">و</div>
                    </div>
                    <div class="row">
                        <div class="key space" data-key=" ">فاصله (Space)</div>
                    </div>
                </div>

                <div class="hands-guide">
                    <div class="hand left-hand" id="left-hand">
                        <div class="finger pinky" id="l-pinky"></div>
                        <div class="finger ring" id="l-ring"></div>
                        <div class="finger middle" id="l-middle"></div>
                        <div class="finger index" id="l-index"></div>
                        <div class="thumb" id="l-thumb"></div>
                    </div>
                    <div class="hand right-hand" id="right-hand">
                        <div class="thumb" id="r-thumb"></div>
                        <div class="finger index" id="r-index"></div>
                        <div class="finger middle" id="r-middle"></div>
                        <div class="finger ring" id="r-ring"></div>
                        <div class="finger pinky" id="r-pinky"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ۳. بخش گزارش پیشرفت -->
        <div id="progress-tab" class="tab-content">
            <h1>کارنامه پیشرفت شما</h1>
            <div class="progress-card">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p class="progress-text" id="progress-text">۰٪ از دوره تکمیل شده است</p>
                <div class="stats-summary">
                    <div>دروس تکمیل شده: <span id="completed-count">0</span> / 50</div>
                </div>
                <button class="reset-btn" onclick="resetProgress()">ریست کردن پیشرفت</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
