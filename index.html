<!-- کیبورد و لایه دست‌های شفاف و هوشمند -->

                    <div class="row" style="direction: ltr;">
                        <div class="key home-key" data-key="ش" id="key-ش">ش</div>
                        <div class="key home-key" data-key="س" id="key-س">س</div>

                        <div class="key home-key" data-key="ب" id="key-ب">ب</div>
                        <div class="key" data-key="ل" id="key-ل">ل</div>
                        <div class="key" data-key="ا" id="key-ا">ا</div>

                        <div class="key home-key" data-key="ن" id="key-ن">ن</div>

                        <div class="key home-key" data-key="ک" id="key-ک">ک</div>

                    <div class="row" style="direction: ltr;">

                <!-- لایه پویای SVG برای حرکت دقیق انگشت‌ها -->
                <svg class="hands-overlay-svg" id="hands-svg">
                    <defs>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="4" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <g id="hands-group">
                        <!-- ۵ انگشت دست چپ -->
                        <path id="path-l-pinky" class="finger-line" d="M 0 0" />
                        <path id="path-l-ring" class="finger-line" d="M 0 0" />
                        <path id="path-l-middle" class="finger-line" d="M 0 0" />
                        <path id="path-l-index" class="finger-line" d="M 0 0" />
                        <path id="path-l-thumb" class="finger-line" d="M 0 0" />

                        <!-- ۵ انگشت دست راست -->
                        <path id="path-r-thumb" class="finger-line" d="M 0 0" />
                        <path id="path-r-index" class="finger-line" d="M 0 0" />
                        <path id="path-r-middle" class="finger-line" d="M 0 0" />
                        <path id="path-r-ring" class="finger-line" d="M 0 0" />
                        <path id="path-r-pinky" class="finger-line" d="M 0 0" />
                    </g>
                </svg>
            </div>
