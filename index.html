<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه پرامپت‌کده: تایپ ده انگشتی دو‌بعدی پیشرفته ⚡</title>
    <style>
        :root {
            --bg-color: #080b11;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --primary-color: #0ea5e9;
            --active-glow: #38bdf8;
            --danger-color: #f43f5e;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            direction: rtl;
            text-align: right;
            padding: 20px 0;
        }

        .container {
            width: 95%;
            max-width: 850px;
        }

        .practice-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .cards-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
            min-height: 65px;
            align-items: center;
        }

        .char-card {
            width: 48px;
            height: 60px;
            background-color: #1f2937;
            border: 2px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 8px;
        }

        .char-card.current {
            border-color: var(--primary-color);
            background-color: rgba(14, 165, 233, 0.2);
            box-shadow: 0 0 12px rgba(14, 165, 233, 0.4);
        }

        .char-card.incorrect {
            border-color: var(--danger-color);
            color: var(--danger-color);
            background-color: rgba(244, 63, 94, 0.2);
        }

        /* بخش ویژوالایزر دو بعدی گرافیکی دست‌ها */
        .hands-visualizer {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 25px 0;
        }

        .hand-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0d131f;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 16px;
            width: 260px;
        }

        .hand-name {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* ساختار فلت گرافیکی دست (انگشتان بالا + کف دست) */
        .fingers-top-row {
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .finger {
            flex: 1;
            height: 65px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px 8px 4px 4px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 6px;
            font-size: 0.6rem;
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .palm-area {
            width: 100%;
            height: 45px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            position: relative;
        }

        .thumb {
            width: 45px;
            height: 32px;
            background-color: #2e3b52;
            border: 1px solid #475569;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        /* حالت روشن شدن فعال انگشت هنگام تایپ */
        .finger.active, .thumb.active {
            background-color: var(--primary-color) !important;
            color: #080b11 !important;
            border-color: #ffffff !important;
            font-weight: bold;
            box-shadow: 0 0 15px var(--active-glow);
            transform: translateY(-4px);
        }

        .hint-text {
            text-align: center;
            margin: 15px 0;
            color: var(--primary-color);
            font-size: 1rem;
            font-weight: bold;
        }

        /* کیبورد مجازی */
        .virtual-keyboard {
            background: #05070c;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 750px;
            margin: 0 auto;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            direction: ltr;
        }

        .v-key {
            background-color: #1e293b;
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .space-key {
            width: 280px !important;
            background-color: #475569;
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="practice-box">
            <div class="stats-bar">
                <div>⏱️ زمان: <span id="time">00:00</span></div>
                <div>⚡ سرعت: <span id="wpm">0</span> WPM</div>
                <div>🎯 دقت: <span id="accuracy">100</span>%</div>
            </div>

            <div id="cards-container" class="cards-container"></div>

            <div id="hint-text" class="hint-text">حرف مورد انتظار رو تایپ کن...</div>

            <!-- ویژوالایزر گرافیکی دست چپ و راست -->
            <div class="hands-visualizer">
                <!-- دست چپ -->
                <div class="hand-wrapper">
                    <div class="hand-name">دست چپ (Left Hand)</div>
                    <div class="fingers-top-row">
                        <div class="finger" id="l-pinky">کوچک</div>
                        <div class="finger" id="l-ring">حلقه</div>
                        <div class="finger" id="l-middle">میانی</div>
                        <div class="finger" id="l-index">اشاره</div>
                    </div>
                    <div class="palm-area">
                        <span style="font-size:0.6rem; color:#6b7280;">کف دست</span>
                        <div class="thumb" id="l-thumb">شست</div>
                    </div>
                </div>

                <!-- دست راست -->
                <div class="hand-wrapper">
                    <div class="hand-name">دست راست (Right Hand)</div>
                    <div class="fingers-top-row">
                        <div class="finger" id="r-index">اشاره</div>
                        <div class="finger" id="r-middle">میانی</div>
                        <div class="finger" id="r-ring">حلقه</div>
                        <div class="finger" id="r-pinky">کوچک</div>
                    </div>
                    <div class="palm-area">
                        <div class="thumb" id="r-thumb">شست</div>
                        <span style="font-size:0.6rem; color:#6b7280;">کف دست</span>
                    </div>
                </div>
            </div>

            <!-- کیبورد مجازی -->
            <div class="virtual-keyboard">
                <div class="keyboard-row">
                    <div class="v-key">ض</div><div class="v-key">ص</div><div class="v-key">ث</div><div class="v-key">ق</div><div class="v-key">ف</div><div class="v-key">غ</div><div class="v-key">ع</div><div class="v-key">ه</div><div class="v-key">خ</div><div class="v-key">ح</div><div class="v-key">ج</div><div class="v-key">چ</div>
                </div>
                <div class="keyboard-row">
                    <div class="v-key">ش</div><div class="v-key">س</div><div class="v-key">ی</div><div class="v-key">ب</div><div class="v-key">ل</div><div class="v-key">ا</div><div class="v-key">ت</div><div class="v-key">ن</div><div class="v-key">م</div><div class="v-key">ک</div><div class="v-key">گ</div>
                </div>
                <div class="keyboard-row">
                    <div class="v-key">ظ</div><div class="v-key">ط</div><div class="v-key">ز</div><div class="v-key">ر</div><div class="v-key">ذ</div><div class="v-key">د</div><div class="v-key">پ</div><div class="v-key">و</div>
                </div>
                <div class="keyboard-row">
                    <div class="v-key space-key">فاصله (Space)</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const textToType = "سلام مهدی عزیز این ویژوالایزر دو بعدی دست هاست";
        let chars = textToType.split('');
        let currentIndex = 0;
        let errorsCount = 0;
        let startTime = null;
        let timerInterval = null;
        let isStarted = false;

        // نقشه‌برداری دقیق هر حرف روی دست و انگشت مربوطه
        const fingerMap = {
            'ض': 'l-pinky', 'ش': 'l-pinky', 'ظ': 'l-pinky',
            'ص': 'l-ring', 'س': 'l-ring', 'ط': 'l-ring',
            'ث': 'l-middle', 'ی': 'l-middle', 'ز': 'l-middle',
            'ق': 'l-index', 'ب': 'l-index', 'ر': 'l-index',
            'ف': 'l-index', 'ل': 'l-index', 'ذ': 'l-index',
            
            'غ': 'r-index', 'ا': 'r-index', 'د': 'r-index', 'ت': 'r-index',
            'ه': 'r-middle', 'ن': 'r-middle', 'و': 'r-middle', 'خ': 'r-middle',
            'م': 'r-ring', 'ح': 'r-ring',
            'ج': 'r-pinky', 'چ': 'r-pinky', 'ک': 'r-pinky', 'گ': 'r-pinky', 'پ': 'r-pinky',
            ' ': 'l-thumb' // شست برای اسپیس
        };

        function init() {
            renderCards();
            updateVisualizer(chars[currentIndex]);
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            let slice = chars.slice(currentIndex, currentIndex + 7);
            
            slice.forEach((char, idx) => {
                let card = document.createElement('div');
                card.className = 'char-card';
                if (idx === 0) card.classList.add('current');
                card.innerText = char === ' ' ? '␣' : char;
                container.appendChild(card);
            });
        }

        function updateVisualizer(char) {
            // خاموش کردن همه انگشت‌ها و شست‌ها
            document.querySelectorAll('.finger, .thumb').forEach(el => {
                el.classList.remove('active');
            });

            let targetId = fingerMap[char];
            if (targetId) {
                let element = document.getElementById(targetId);
                if (element) {
                    element.classList.add('active');
                }
            }
            document.getElementById('hint-text').innerText = `کلید بعدی: "${char === ' ' ? 'فاصله' : char}"`;
        }

        document.addEventListener('keydown', (e) => {
            let targetChar = chars[currentIndex];
            if (!targetChar) return;

            if (!isStarted) {
                isStarted = true;
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
            }

            if (e.key === targetChar || (targetChar === ' ' && e.key === ' ')) {
                currentIndex++;
                let accuracy = Math.max(0, Math.round(((currentIndex - errorsCount) / currentIndex) * 100));
                document.getElementById('accuracy').innerText = accuracy;

                if (currentIndex >= chars.length) {
                    clearInterval(timerInterval);
                    alert('🎉 عالی بود داشم! تمرین با موفقیت تموم شد.');
                    currentIndex = 0;
                    errorsCount = 0;
                }
                renderCards();
                updateVisualizer(chars[currentIndex]);
            } else if (e.key.length === 1) {
                errorsCount++;
                let container = document.getElementById('cards-container');
                if (container.firstChild) {
                    container.firstChild.classList.add('incorrect');
                    setTimeout(() => container.firstChild.classList.remove('incorrect'), 250);
                }
            }
        });

        function updateTimer() {
            let elapsed = Math.floor((Date.now() - startTime) / 1000);
            let m = String(Math.floor(elapsed / 60)).padStart(2, '0');
            let s = String(elapsed % 60).padStart(2, '0');
            document.getElementById('time').innerText = `${m}:${s}`;
            
            let mins = elapsed / 60;
            if (mins > 0) {
                let wpm = Math.round((currentIndex / 5) / mins);
                document.getElementById('wpm').innerText = wpm;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
