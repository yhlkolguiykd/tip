<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه پرامپت‌کده: تایپ ده انگشتی ساده ⚡</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #141c2e;
            --text-color: #f1f5f9;
            --primary-color: #38bdf8;
            --danger-color: #f43f5e;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            direction: rtl;
            text-align: right;
            padding: 20px 0;
        }

        .container {
            width: 92%;
            max-width: 800px;
        }

        .practice-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.25);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .cards-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
            min-height: 60px;
            align-items: center;
        }

        .char-card {
            width: 45px;
            height: 55px;
            background-color: #1a233a;
            border: 2px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 8px;
        }

        .char-card.current {
            border-color: var(--primary-color);
            background-color: rgba(56, 189, 248, 0.15);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .char-card.incorrect {
            border-color: var(--danger-color);
            color: var(--danger-color);
            background-color: rgba(244, 63, 94, 0.15);
        }

        /* --- طراحی دست‌های ساده و مینیمال --- */
        .simple-hands-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }

        .simple-hand {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            width: 220px;
            text-align: center;
        }

        .hand-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* بخش انگشتان ساده */
        .simple-fingers {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-bottom: 6px;
        }

        .s-finger {
            flex: 1;
            height: 50px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 6px;
            font-size: 0.6rem;
            color: #64748b;
            transition: 0.15s;
        }

        .s-thumb {
            width: 100%;
            height: 24px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            font-size: 0.6rem;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }

        /* حالت روشن شدن ساده و شیک */
        .s-finger.active, .s-thumb.active {
            background-color: var(--primary-color) !important;
            color: #0b0f17 !important;
            border-color: #fff !important;
            font-weight: bold;
            box-shadow: 0 0 10px var(--primary-color);
            transform: translateY(-3px);
        }

        .hint-text {
            text-align: center;
            margin: 10px 0;
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* کیبورد مجازی */
        .virtual-keyboard {
            background: #080c14;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 720px;
            margin: 0 auto;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            direction: ltr;
        }

        .v-key {
            background-color: #1b2438;
            color: #fff;
            padding: 8px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            min-width: 38px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .space-key {
            width: 260px !important;
            background-color: #475569;
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="practice-box">
            <div class="stats-bar">
                <div>⏱️ زمان: <span id="time">00:00</span></div>
                <div>⚡ سرعت: <span id="wpm">0</span> WPM</div>
                <div>🎯 دقت: <span id="accuracy">100</span>%</div>
            </div>

            <div id="cards-container" class="cards-container"></div>

            <div id="hint-text" class="hint-text">حرف بعدی رو تایپ کن...</div>

            <!-- نمای ساده دو دست (چپ و راست) -->
            <div class="simple-hands-container">
                <!-- دست چپ -->
                <div class="simple-hand">
                    <div class="hand-label">دست چپ</div>
                    <div class="simple-fingers">
                        <div class="s-finger" id="sf-l-pinky">کوچک</div>
                        <div class="s-finger" id="sf-l-ring">حلقه</div>
                        <div class="s-finger" id="sf-l-middle">میانی</div>
                        <div class="s-finger" id="sf-l-index">اشاره</div>
                    </div>
                    <div class="s-thumb" id="sf-l-thumb">شست</div>
                </div>

                <!-- دست راست -->
                <div class="simple-hand">
                    <div class="hand-label">دست راست</div>
                    <div class="simple-fingers">
                        <div class="s-finger" id="sf-r-index">اشاره</div>
                        <div class="s-finger" id="sf-r-middle">میانی</div>
                        <div class="s-finger" id="sf-r-ring">حلقه</div>
                        <div class="s-finger" id="sf-r-pinky">کوچک</div>
                    </div>
                    <div class="s-thumb" id="sf-r-thumb">شست</div>
                </div>
            </div>

            <!-- کیبورد مجازی -->
            <div class="virtual-keyboard">
                <div class="keyboard-row">
                    <div class="v-key">ض</div><div class="v-key">ص</div><div class="v-key">ث</div><div class="v-key">ق</div><div class="v-key">ف</div><div class="v-key">غ</div><div class="v-key">ع</div><div class="v-key">ه</div><div class="v-key">خ</div><div class="v-key">ح</div><div class="v-key">ج</div><div class="v-key">چ</div>
                </div>
                <div class="keyboard-row">
                    <div class="v-key">ش</div><div class="v-key">س</div><div class="v-key">ی</div><div class="v-key">ب</div><div class="v-key">ل</div><div class="v-key">ا</div><div class="v-key">ت</div><div class="v-key">ن</div><div class="v-key">م</div><div class="v-key">ک</div><div class="v-key">گ</div>
                </div>
                <div class="keyboard-row">
                    <div class="v-key">ظ</div><div class="v-key">ط</div><div class="v-key">ز</div><div class="v-key">ر</div><div class="v-key">ذ</div><div class="v-key">د</div><div class="v-key">پ</div><div class="v-key">و</div>
                </div>
                <div class="keyboard-row">
                    <div class="v-key space-key">فاصله (Space)</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const textToType = "سلام مهدی عزیز این تمرین تایپ با دست ساده است";
        let chars = textToType.split('');
        let currentIndex = 0;
        let errorsCount = 0;
        let startTime = null;
        let timerInterval = null;
        let isStarted = false;

        // نگاشت دقیق انگشتان ساده
        const fingerMap = {
            'ض': 'sf-l-pinky', 'ش': 'sf-l-pinky', 'ظ': 'sf-l-pinky',
            'ص': 'sf-l-ring', 'س': 'sf-l-ring', 'ط': 'sf-l-ring',
            'ث': 'sf-l-middle', 'ی': 'sf-l-middle', 'ز': 'sf-l-middle',
            'ق': 'sf-l-index', 'ب': 'sf-l-index', 'ر': 'sf-l-index',
            'ف': 'sf-l-index', 'ل': 'sf-l-index', 'ذ': 'sf-l-index',
            
            'غ': 'sf-r-index', 'ا': 'sf-r-index', 'د': 'sf-r-index', 'ت': 'sf-r-index',
            'ه': 'sf-r-middle', 'ن': 'sf-r-middle', 'و': 'sf-r-middle', 'خ': 'sf-r-middle',
            'م': 'sf-r-ring', 'ح': 'sf-r-ring',
            'ج': 'sf-r-pinky', 'چ': 'sf-r-pinky', 'ک': 'sf-r-pinky', 'گ': 'sf-r-pinky', 'پ': 'sf-r-pinky',
            ' ': 'sf-l-thumb'
        };

        function init() {
            renderCards();
            updateVisualizer(chars[currentIndex]);
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            let slice = chars.slice(currentIndex, currentIndex + 7);
            
            slice.forEach((char, idx) => {
                let card = document.createElement('div');
                card.className = 'char-card';
                if (idx === 0) card.classList.add('current');
                card.innerText = char === ' ' ? '␣' : char;
                container.appendChild(card);
            });
        }

        function updateVisualizer(char) {
            document.querySelectorAll('.s-finger, .s-thumb').forEach(el => {
                el.classList.remove('active');
            });

            let targetId = fingerMap[char];
            if (targetId) {
                let element = document.getElementById(targetId);
                if (element) {
                    element.classList.add('active');
                }
            }
            document.getElementById('hint-text').innerText = `حرف بعدی: "${char === ' ' ? 'فاصله' : char}"`;
        }

        document.addEventListener('keydown', (e) => {
            let targetChar = chars[currentIndex];
            if (!targetChar) return;

            if (!isStarted) {
                isStarted = true;
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
            }

            if (e.key === targetChar || (targetChar === ' ' && e.key === ' ')) {
                currentIndex++;
                let accuracy = Math.max(0, Math.round(((currentIndex - errorsCount) / currentIndex) * 100));
                document.getElementById('accuracy').innerText = accuracy;

                if (currentIndex >= chars.length) {
                    clearInterval(timerInterval);
                    alert('🎉 دمت گرم داشم! تمرین به اتمام رسید.');
                    currentIndex = 0;
                    errorsCount = 0;
                }
                renderCards();
                updateVisualizer(chars[currentIndex]);
            } else if (e.key.length === 1) {
                errorsCount++;
                let container = document.getElementById('cards-container');
                if (container.firstChild) {
                    container.firstChild.classList.add('incorrect');
                    setTimeout(() => container.firstChild.classList.remove('incorrect'), 250);
                }
            }
        });

        function updateTimer() {
            let elapsed = Math.floor((Date.now() - startTime) / 1000);
            let m = String(Math.floor(elapsed / 60)).padStart(2, '0');
            let s = String(elapsed % 60).padStart(2, '0');
            document.getElementById('time').innerText = `${m}:${s}`;
            
            let mins = elapsed / 60;
            if (mins > 0) {
                let wpm = Math.round((currentIndex / 5) / mins);
                document.getElementById('wpm').innerText = wpm;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
